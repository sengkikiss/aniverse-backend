services:
  - type: web
    name: aniverse-backend
    runtime: node
    repo: https://github.com/YOUR_USERNAME/aniverse-backend
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_PATH
        value: /data/aniverse.db
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
    disk:
      name: aniverse-data
      mountPath: /data
      sizeGB: 1
    buildCommand: npm install
    startCommand: npm start
